name: release

# Tagging `v*` publishes a release. `workflow_dispatch` builds the same
# matrix without publishing, which is the only way to find out that a target
# broke before a tag is already cut and public.
#
# Unix only: osmflatc isn't supported on Windows, so no Windows artifact is
# published (see `#[cfg(unix)]` in osmflatc/src/run.rs).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (off = build and upload artifacts only)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One target failing shouldn't hide whether the others are healthy --
      # a rocksdb build break is usually platform-specific.
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: the binary links against the runner's glibc, and
          # building on 24.04 (glibc 2.39) yields something that won't start on
          # any older distro. The oldest runner we build on sets the floor.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-14

    steps:
      - uses: actions/checkout@v4

      # osmflatc's build.rs runs prost-build over the OSM PBF .proto files, so
      # protoc has to exist before cargo build, on every platform.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # librocksdb-sys compiles RocksDB from source and runs bindgen over its
      # headers, so a C++ toolchain and libclang are build-time requirements.
      # macOS gets both from the Xcode command line tools.
      - name: Install libclang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev llvm-dev

      # That RocksDB build is the bulk of the wall clock, and it is identical
      # between a dry run and the tag that follows it.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # --locked: a published binary should be built from the dependency graph
      # in the tag, not whatever resolved that morning.
      - name: Build
        run: cargo build --locked --profile dist -p osmflatc --target ${{ matrix.target }}

      # Catches a binary that built but can't run -- e.g. a cross-compiled arch
      # the runner can't execute.
      - name: Smoke test
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/dist/osmflatc"
          "$bin" --version
          "$bin" --help > /dev/null

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="osmflatc"))')"
          name="osmflatc-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/dist/osmflatc" "dist/$name/"
          cp LICENSE-APACHE LICENSE-MIT README.md "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"
          echo "asset=$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ steps.package.outputs.asset }}
          if-no-files-found: error

  release:
    name: publish
    needs: build
    # Only a tag publishes. A dispatch run stops after `build`, leaving the
    # artifacts downloadable from the run for inspection.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One checksum file over every archive, so a download can be verified
      # without trusting the transport.
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --generate-notes \
            artifacts/*
